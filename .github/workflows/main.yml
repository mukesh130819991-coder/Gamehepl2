name: Build Mod
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
    - name: Extract zip
      run: unzip FakepixelMod.zip
    - name: Setup Gradle
      run: |
        cd FakepixelMod
        chmod +x gradlew
        ./gradlew setupDecompWorkspace --no-daemon
    - name: Build
      run: |
        cd FakepixelMod
        ./gradlew build --no-daemon
    - uses: actions/upload-artifact@v4
      with:
        name: FakepixelMod-jar
        path: FakepixelMod/build/libs/*.jar
