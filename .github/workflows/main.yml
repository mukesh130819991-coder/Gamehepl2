name: Build Mod
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
    - name: Extract zip
      run: unzip FakepixelMod.zip
    - name: Build
      run: cd FakepixelMod && chmod +x gradlew && ./gradlew build
    - uses: actions/upload-artifact@v4
      with:
        name: FakepixelMod-jar
        path: FakepixelMod/build/libs/*.jar
